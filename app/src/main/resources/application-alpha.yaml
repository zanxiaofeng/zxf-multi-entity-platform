# Alpha 实体部署配置（K8s ConfigMap 注入，文档 5.4.3）
#
# 三个开关必须成对出现（文档 5.3 / 6.3）：
#   platform.entity=alpha  ↔  SPRING_PROFILES_ACTIVE=alpha,prod  ↔  构建产物 -Palpha
# 漂移由启动期 PolicyRegistry 校验、CI 装配矩阵、/actuator/info 巡检三层防线兜底。
platform:
  entity: alpha

spring:
  datasource:
    # 分库（schema-per-entity，文档 2.4）：生产示例 jdbc:oracle:thin:@//alpha-db:1521/ALPHA
    # demo 用独立 H2 内存库，两实体互不可见
    url: jdbc:h2:mem:alpha-db;DB_CLOSE_DELAY=-1
    username: sa
