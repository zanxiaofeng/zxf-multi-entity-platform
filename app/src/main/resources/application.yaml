# 公共配置：两个实体部署共用（文档 5.4.3）
spring:
  threads:
    virtual:
      # JDK 21+ 虚拟线程（文档 5.0）。ThreadLocal 语义不变，EntityContext 传播方案不变
      enabled: true
  # 金额的 BigDecimal 序列化须保持十进制 plain 形态（190 而非 1.9E+2）——
  # Boot 4 / Jackson 3 已移除 spring.jackson.generator.* 属性绑定，
  # 经 core 的 JacksonConfig（JsonMapperBuilderCustomizer）开启，见该类
  jpa:
    hibernate:
      # schema 由 Flyway 管理，启动时校验实体映射与迁移脚本一致
      ddl-auto: validate
    open-in-view: false
  flyway:
    # 公共迁移目录 + per-entity 迁移目录，按 platform.entity 组合（文档 6.1）
    # per-entity 脚本在对应实体模块内，随 Maven profile 裁剪进入产物
    # common 目录同时承载 Flowable ACT_* 引擎表（V3，文档 7.3②）
    locations: classpath:db/migration/common,classpath:db/migration/${platform.entity}

# Flowable 引擎属共享内核（文档 7.1），运维纪律（文档规则 9）
flowable:
  # ACT_* 表结构归 Flyway 管（common/V3__flowable_engine_tables.sql），
  # 禁止引擎启动期自行 DDL——否则与 Flyway 管理产生漂移冲突
  database-schema-update: false
  # BPMN 自动部署默认扫描 classpath*:/processes/：per-entity 流程定义随实体模块裁剪进产物，
  # 装配冒烟断言"同 key 定义数 == 1"防静默错路由（文档 7.2/7.4）

# Flowable Job 执行器线程池（引擎自有线程）：默认值见 FlowableJobProperties，
# 此处显式列出便于运维查阅；按实体差异化时在 application-{entity}.yaml 覆盖
platform:
  flowable-job:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100
    # 引擎级调优（文档 7.7.1 组件 4）：节点级可用 failedJobRetryTimeCycle 覆盖
    number-of-retries: 3
    failed-job-wait-time: 10
  # 下游通知服务（文档 7.7.2 组件 11）：NotificationClient 经 RestClient 调用，
  # 配合 Resilience4j CircuitBreaker + Retry。生产环境替换为真实通知服务地址。
  notification:
    base-url: http://localhost:8081

# 可观测性：/actuator/info 输出当前实体（EntityInfoContributor），接入监控巡检（文档 6.3）
# /actuator/metrics + /prometheus：指标支柱实体打标（MetricsConfig，文档 5.11.1）
# health.show-details=always：暴露各组件（db、flowable、diskSpace…）明细，便于文档 7.7.2 组件 14
# 的 FlowableEngineHealthIndicator 在 /actuator/health 直接可见；生产环境按需收紧为 when-authorized
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# 所有日志带 entity 标签（文档 2.5）：MDC key 的唯一事实来源是 EntityContext.MDC_KEY，
# 由 EntityContextFilter / TaskDecorator / delegate 基类写入，改动需同步下方 pattern。
# traceId 全链路（logging.md）：MDC key 唯一事实来源是 TraceIdFilter.MDC_KEY，
# 上游 X-Trace-Id 白名单校验后注入、响应头回传
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] entity=%X{entity:-none} trace=%X{traceId:-none} %-40.40logger{39} : %m%n"

server:
  port: 8080
